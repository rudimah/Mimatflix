{% extends "base.html" %}
{% block content %}
<div class="w-full max-w-md mx-auto mt-12 md:mt-24 bg-white dark:bg-cardbg p-10 rounded-3xl shadow-2xl border border-slate-100 dark:border-white/5">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-black text-slate-900 dark:text-white mb-2">Accès Restreint</h1>
        <p class="text-sm text-slate-500 dark:text-gray-400">Veuillez vous authentifier pour continuer</p>
    </div>
    {% if error %}
    <div class="bg-red-50 dark:bg-red-500/10 text-red-600 dark:text-red-400 p-4 rounded-xl text-sm font-semibold mb-6 border border-red-200 dark:border-red-500/30 text-center">{{ error }}</div>
    {% endif %}
    <form method="POST" class="flex flex-col gap-6">
        <div class="space-y-2">
            <label class="block text-[11px] font-black text-slate-400 dark:text-gray-500 tracking-wider uppercase">Mot de passe Administrateur</label>
            <input type="password" name="password" required class="w-full bg-slate-50 dark:bg-darkbg border border-slate-200 dark:border-white/10 rounded-xl px-5 py-4 text-sm focus:outline-none focus:ring-2 focus:ring-netflix transition-all text-slate-900 dark:text-white placeholder:text-slate-400 shadow-inner" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-netflix text-white font-bold py-4 rounded-xl mt-2 hover:bg-red-700 hover:scale-[1.02] transition-all shadow-lg shadow-netflix/30">Se connecter</button>
    </form>
</div>
{% endblock %}
