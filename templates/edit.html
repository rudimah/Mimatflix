{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto mt-8 px-2">
    <h1 class="text-3xl font-black mb-8 flex items-center gap-4 text-slate-900 dark:text-white">
        <a href="{{ url_for('add_movie') }}" class="p-2 rounded-full bg-slate-200 dark:bg-cardbg text-slate-500 dark:text-gray-400 hover:text-netflix dark:hover:text-white transition-all hover:scale-105">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </a>
        Éditer le film
    </h1>
    {% if error %}
    <div class="bg-red-50 dark:bg-red-500/10 text-red-600 dark:text-red-400 p-4 rounded-xl text-sm font-semibold mb-6 border border-red-200 dark:border-red-500/30">{{ error }}</div>
    {% endif %}
    <div class="bg-white dark:bg-cardbg p-8 rounded-3xl border border-slate-200 dark:border-white/5 shadow-2xl flex flex-col gap-8">
        <div class="flex items-center gap-6 pb-8 border-b border-slate-200 dark:border-white/10">
            <img src="{{ movie.poster }}" class="w-20 h-28 object-cover rounded-xl shadow-md border border-slate-100 dark:border-white/10">
            <div class="space-y-1">
                <h2 class="text-2xl font-black text-slate-900 dark:text-white mb-2">{{ movie.title }}</h2>
                <div class="flex flex-wrap gap-2 text-xs font-medium text-slate-500 dark:text-gray-400">
                    <span class="bg-slate-100 dark:bg-darkbg px-2.5 py-1 rounded-md border border-slate-200 dark:border-white/5">ID: {{ movie.id_movie }}</span>
                    {% if movie.created_at %}
                    <span class="bg-slate-100 dark:bg-darkbg px-2.5 py-1 rounded-md border border-slate-200 dark:border-white/5">Créé: {{ movie.created_at }}</span>
                    {% endif %}
                    {% if movie.updated_at %}
                    <span class="bg-slate-100 dark:bg-darkbg px-2.5 py-1 rounded-md border border-slate-200 dark:border-white/5">MAJ: {{ movie.updated_at }}</span>
                    {% endif %}
                </div>
            </div>
        </div>
        <form method="POST" class="flex flex-col gap-6">
            <div class="space-y-2">
                <label class="block text-[11px] font-black text-slate-400 dark:text-gray-500 tracking-wider uppercase">Titre</label>
                <input type="text" name="title" value="{{ movie.title }}" required class="w-full bg-slate-50 dark:bg-darkbg border border-slate-200 dark:border-white/10 rounded-xl px-5 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-netflix transition-all text-slate-900 dark:text-gray-100">
            </div>
            <div class="space-y-2">
                <label class="block text-[11px] font-black text-slate-400 dark:text-gray-500 tracking-wider uppercase">URL du Poster</label>
                <input type="text" name="poster" value="{{ movie.poster }}" required class="w-full bg-slate-50 dark:bg-darkbg border border-slate-200 dark:border-white/10 rounded-xl px-5 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-netflix transition-all text-slate-900 dark:text-gray-100">
            </div>
            <div class="space-y-2">
                <label class="block text-[11px] font-black text-slate-400 dark:text-gray-500 tracking-wider uppercase">Lien IMDb</label>
                <input type="text" name="url" value="{{ movie.url }}" required class="w-full bg-slate-50 dark:bg-darkbg border border-slate-200 dark:border-white/10 rounded-xl px-5 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-netflix transition-all text-slate-900 dark:text-gray-100">
            </div>
            <div class="space-y-2">
                <label class="block text-[11px] font-black text-slate-400 dark:text-gray-500 tracking-wider uppercase">Fichier Vidéo (.mp4)</label>
                <input type="text" name="movie_url" value="{{ movie.movie_url if movie.movie_url else '' }}" class="w-full bg-slate-50 dark:bg-darkbg border border-slate-200 dark:border-white/10 rounded-xl px-5 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-netflix transition-all text-slate-900 dark:text-gray-100">
            </div>
            <div class="space-y-2">
                <label class="block text-[11px] font-black text-slate-400 dark:text-gray-500 tracking-wider uppercase">Lien Source</label>
                <input type="text" name="source_link" value="{{ movie.source_link if movie.source_link else '' }}" class="w-full bg-slate-50 dark:bg-darkbg border border-slate-200 dark:border-white/10 rounded-xl px-5 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-netflix transition-all text-slate-900 dark:text-gray-100">
            </div>
            <div class="space-y-2">
                <label class="block text-[11px] font-black text-slate-400 dark:text-gray-500 tracking-wider uppercase">Statut</label>
                <select name="status" class="w-full bg-slate-50 dark:bg-darkbg border border-slate-200 dark:border-white/10 rounded-xl px-5 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-netflix transition-all text-slate-900 dark:text-gray-100 appearance-none">
                    <option value="pending" {% if movie.status == 'pending' %}selected{% endif %}>En attente</option>
                    <option value="available" {% if movie.status == 'available' %}selected{% endif %}>Disponible</option>
                    <option value="deleted" {% if movie.status == 'deleted' %}selected{% endif %}>Supprimé</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-netflix text-white font-bold py-4 rounded-xl mt-4 hover:bg-red-700 transition-all shadow-lg hover:shadow-netflix/40 hover:-translate-y-1">Sauvegarder les modifications</button>
        </form>
    </div>
</div>
{% endblock %}
